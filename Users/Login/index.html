* {

body {

}

.container {

}

.screen {		
	background: linear-gradient(90deg, #5D54A4, #7C78B8);

.screen__content {

}

.screen__background {

	bottom: 0;
	z-index: 0;

	clip-path: inset(0 0 0 0);	
}

.screen__background__shape {
	transform: rotate(45deg);
	position: absolute;
}

.screen__background__shape1 {
	height: 520px;
	width: 520px;
	background: #FFF;	
	top: -50px;
	right: 120px;	
	border-radius: 0 72px 0 0;
}

.screen__background__shape2 {
	height: 220px;
	width: 220px;
	background: #6C63AC;	
	top: -172px;
	right: 0;	
	border-radius: 32px;
}

.screen__background__shape3 {
	height: 540px;
	width: 190px;
	background: linear-gradient(270deg, #5D54A4, #6A679E);
	top: -24px;
	right: 0;	
	border-radius: 32px;
}

.screen__background__shape4 {
	height: 400px;
	width: 200px;
	background: #7E7BB9;	
	top: 420px;
	right: 50px;	
	border-radius: 60px;
}

.login {

	padding: 30px;

}

.login__field {

}

.login__icon {
	position: absolute;
	top: 30px;
	color: #7875B5;
}

.login__input {

	border-bottom: 2px solid #D1D1D4;

	padding: 10px;
	padding-left: 24px;

	width: 75%;
	transition: .2s;
}

.login__input:active,
.login__input:focus,
.login__input:hover {

	border-bottom-color: #6A679E;
}

.login__submit {
	background: #fff;
	font-size: 14px;
	margin-top: 30px;

	color: #7875B5;
}

}

	align-items: center;
	justify-content: center;
}

.social-login__icon {

}
